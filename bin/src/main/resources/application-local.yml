spring:
  datasource:
    url: jdbc:h2:file:./data/udaybuilders;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  azure:
    connection-string: ""
  cors:
    allowed-origins: http://localhost:4200
